<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:30px; }
    .card{
      max-width:450px; margin:auto; background:white; padding:20px;
      border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }
    input{
      width:100%; padding:10px; border-radius:8px;
      border:1px solid #ccc; margin-bottom:10px;
    }
    button{
      width:100%; padding:12px; background:black; color:#fff;
      border:none; border-radius:8px; cursor:pointer;
      font-size:16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>TikTok Downloader</h2>
    <p>Paste URL video TikTok kamu dan klik Download.</p>

    <input id="url" type="text" placeholder="https://www.tiktok.com/..." />

    <button onclick="download()">Download</button>

    <p id="status" style="margin-top:10px;color:red"></p>
  </div>

  <script>
    async function download() {
      const url = document.getElementById('url').value.trim();
      if (!url) return alert('Masukkan URL dulu');

      document.getElementById('status').innerHTML = "Processing...";

      const res = await fetch("/api/download?url=" + encodeURIComponent(url));

      if (!res.ok) {
        document.getElementById('status').innerHTML = "Gagal mengambil video";
        return;
      }

      const blob = await res.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "tiktok-video.mp4";
      link.click();

      document.getElementById('status').innerHTML = "";
    }
  </script>
</body>
</html>
